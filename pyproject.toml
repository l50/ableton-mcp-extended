[project]
name = "ableton-mcp-extended"
version = "1.0.0"
description = "Ableton Live integration through the Model Context Protocol with ElevenLabs and extended features"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "uisato"}
]
license = "MIT"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "mcp[cli]>=1.3,<2",
    "elevenlabs>=0.2.26",
    "python-dotenv>=1.0.0",
]

[project.scripts]
ableton-mcp-extended = "MCP_Server.server:main"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["MCP_Server", "elevenlabs_mcp", "Ableton-MCP_hybrid-server.AbletonMCP_UDP"]

[project.urls]
"Homepage" = "https://github.com/uisato/ableton-mcp-extended"
"Bug Tracker" = "https://github.com/uisato/ableton-mcp-extended/issues"

[project.optional-dependencies]
xy_controller = [
    "pynput>=1.7.6",
    "screeninfo>=0.8.1",
]
test = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[tool.pytest.ini_options]
markers = [
    "integration: requires running Ableton Live instance",
]
addopts = "-m 'not integration'"

[tool.coverage.run]
source = ["MCP_Server", "AbletonMCP_Remote_Script"]

[tool.coverage.report]
# Unit-test coverage gate. Kept below the measured total so feature PRs that
# cover their own new code at 95% still pass.
fail_under = 95
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]